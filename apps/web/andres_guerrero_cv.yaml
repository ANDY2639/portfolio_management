design:
  theme: cvandy

  page:
    size: us-letter
    top_margin: 0.7in
    bottom_margin: 0.7in
    left_margin: 0.7in
    right_margin: 0.7in
    show_footer: false
    show_top_note: false

  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    headline: rgb(0, 79, 144)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 79, 144)
    links: rgb(0, 79, 144)

  typography:
    line_spacing: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
    font_family:
      body: Raleway
      name: Raleway
      headline: Raleway
      connections: Raleway
      section_titles: Raleway
    font_size:
      body: 10pt
      name: 24pt
      headline: 10pt
      connections: 10pt
      section_titles: 1.4em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true

  links:
    underline: false
    show_external_link_icon: false

  header:
    alignment: left
    photo_width: 4cm
    photo_position: right
    photo_space_left: 0.2cm
    photo_space_right: 0cm
    space_below_name: 0.2cm
    space_below_headline: 0.5cm
    space_below_connections: 0.35cm
    connections:
      phone_number_format: international

  section_titles:
    type: with_full_line
    line_thickness: 1.5pt
    space_above: 0.38cm
    space_below: 0.5cm

  sections:
    allow_page_break: true
    space_between_regular_entries: 1em
    space_between_text_based_entries: 0.3em
    show_time_spans_in:
      - experience

  entries:
    date_and_location_width: 4.15cm
    side_space: 0.2cm
    space_between_columns: 0.1cm
    allow_page_break: false
    short_second_row: true
    summary:
      space_above: 0cm
      space_left: 0cm
    highlights:
      space_left: 0.2cm
      space_above: 0.2cm
      space_between_items: 0.05cm
      space_between_bullet_and_text: 0.5em

  templates:
    experience_entry:
      main_column: |-
        **POSITION**, COMPANY – LOCATION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE

locale:
  language: spanish
  present: presente

settings:
  current_date: "2026-03-01"
  render_command:
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_typst: false
    dont_generate_pdf: false
    dont_generate_png: true
